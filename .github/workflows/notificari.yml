name: NotificÄri turÄ

# RuleazÄ la fiecare 15 minute. GitHub nu garanteazÄ minutul exact â
# ĂŽn orele aglomerate poate ĂŽntĂ˘rzia 3-5 minute. De asta trimitem
# notificarea ĂŽntr-o fereastrÄ, nu la secundÄ fixÄ (vezi trimite.js).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # buton de rulare manualÄ, pentru testare

jobs:
  trimite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: InstaleazÄ web-push
        run: npm install web-push@3.6.7 --no-save

      - name: Trimite notificÄrile
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FB_URL: ${{ secrets.FB_URL }}
        run: node .github/scripts/trimite.js
