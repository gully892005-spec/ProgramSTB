name: Notificări tură

# Rulează la fiecare 15 minute. GitHub nu garantează minutul exact —
# în orele aglomerate poate întârzia 3-5 minute. De asta trimitem
# notificarea într-o fereastră, nu la secundă fixă (vezi trimite.js).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # buton de rulare manuală, pentru testare

jobs:
  trimite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalează web-push
        run: npm install web-push@3.6.7 --no-save

      - name: Trimite notificările
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FB_URL: ${{ secrets.FB_URL }}
        run: node .github/scripts/trimite.js
